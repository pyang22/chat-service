{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Login</h1>
<form method="post">
  {% csrf_token %}
  {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
  {{ form.as_p }}
  <button type="submit">Login</button>
</form>
<p>Need an account? <a href="{% url 'accounts:register' %}">Register</a></p>
{% endblock %}
